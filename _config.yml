title: Pangolynne
tagline: Photos by Pangolynne
description: Photography by Danny Hillyer. Cars, music, and exploration.
locale: en_AU
url: "https://pangolynne.com"
baseurl: ""
author: Danny
permalink: /:year/:month/:day/:title/

social:
  links:
    - https://www.instagram.com/pango_lynne

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate-v2
  - jekyll-redirect-from

exclude:
  - src/
  - package.json
  - package-lock.json
  - README.md

collections:
  pages:
    output: true
    permalink: /:path/

pagination:
  enabled: true
  per_page: 9
  permalink: "/page/:num/"
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

photo_tag_per_page: 24

autopages:
  enabled: true
  tags:
    enabled: true
    layouts:
      - "tags.html"
    title: "Posts tagged :tag"
    permalink: "/tag/:tag"
    slugify:
      mode: "default"
      cased: false
  categories:
    enabled: true
    layouts:
      - "categories.html"
    title: "Category :cat"
    permalink: "/category/:cat"
    slugify:
      mode: "default"
      cased: false
  collections:
    enabled: false
