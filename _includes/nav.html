<header class="sticky top-0 z-999 flex justify-center px-3 pt-3">
  <div class="relative w-fit max-w-full">

    <nav class="flex items-center justify-between gap-8 sm:gap-16 rounded-xl bg-taupe-300 px-4 py-3 text-neutral-900 shadow-lg shadow-black/40">
      <a href="{{ '/' | relative_url }}" class="text-lg font-bold hover:text-green-800">{{ site.title }}</a>

      <!-- Links: sm and up -->
      <div class="hidden sm:flex gap-3">
        <a href="{{ '/events' | relative_url }}" class="hover:text-green-800 hover:underline hover:decoration-2">Events</a>
        <a href="{{ 'favourites' | slugify | prepend: '/photos/' | append: '/' | downcase | relative_url }}" class="hover:text-green-800 hover:underline hover:decoration-2">Favourites</a>
        <a href="{{ '/contact' | relative_url }}" class="hover:text-green-800 hover:underline hover:decoration-2">Contact</a>
      </div>

      <!-- Social: always visible -->
      <div class="flex items-center gap-2">
        <a href="https://www.facebook.com/" aria-label="Facebook">
          <img src="/assets/images/facebook.svg" alt="" class="size-5">
        </a>
        <a href="https://www.instagram.com/pango_lynne/" aria-label="Instagram">
          <img src="/assets/images/instagram.svg" alt="" class="size-5">
        </a>
      </div>

      <!-- Toggle: below sm -->
      <button id="menu-toggle" type="button" class="sm:hidden cursor-pointer"
              aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-menu">
        <img src="/assets/images/menu.svg" alt="" class="size-5">
      </button>
    </nav>

    <!-- Dropdown: below sm, closed by default -->
    <div id="mobile-menu"
     class="hidden sm:hidden absolute inset-x-0 top-full mt-2 rounded-xl bg-taupe-300 p-4 text-neutral-900 shadow-lg shadow-black/40">
      <div class="flex flex-col gap-3">
        <a href="{{ '/events' | relative_url }}" class="hover:text-green-800">Events</a>
        <a href="{{ 'favourites' | slugify | prepend: '/photos/' | append: '/' | downcase | relative_url }}" class="hover:text-green-800">Favourites</a>
        <a href="{{ '/contact' | relative_url }}" class="hover:text-green-800">Contact</a>
      </div>
    </div>

  </div>
</header>

<script>
  const toggle = document.getElementById('menu-toggle');
  const menu = document.getElementById('mobile-menu');
  toggle.addEventListener('click', () => {
    const isHidden = menu.classList.toggle('hidden');
    toggle.setAttribute('aria-expanded', String(!isHidden));
  });
</script>
