<a href="{{ post.url | relative_url }}"
  style="--r: {{ rot }}deg; --x: {{ dx }}px; --y: {{ dy }}px"
  class="relative block rounded-md shadow-lg shadow-black/40
          hover:z-10 hover:scale-105">
  {% if post.image %}
  <div class="h-56 rounded-md flex flex-col justify-end-safe bg-cover" style="background-image: url('{{ post.image | relative_url }}')">
  {% else %}
  <div class="h-56 rounded-md flex flex-col justify-end-safe bg-cover bg-[url(/assets/images/default.jpg)]">
  {% endif %}
    <div class="h-32 p-3 rounded-b-md bg-gradient-to-t from-neutral-900 to-neutral-900/0 flex flex-col justify-end-safe">
      <p class="text-taupe-300 text-sm font-semibold leading-6">{{ post.title }}</p>
      <p class="text-taupe-400 text-xs">{{ post.date | date: "%B %-d, %Y" }}</p>
    </div>
  </div>
</a>
